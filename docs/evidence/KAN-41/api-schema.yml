    post:
      operationId: ratings_uat_session_create
      description: |-
        POST /ratings/uat/session/ — start a tester session.

        FIX (OBJ-01 join): persist product_id from the payload. The OBJ-01 KPI
        joins fit-visualization ratings to sessions by (user, product); without
        this stamp every session matched nothing and OBJ-01 under-counted.
      tags:
      - ratings
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    AddToCart:
      type: object
      description: Validate a catalog item and quantity for adding to a cart.
      properties:
        catalog_item:
          type: string
        quantity:
          type: integer
          minimum: 1
          default: 1
      required:
      - catalog_item
    AvatarPreset:
      type: object
      description: |-
        Avatar preset serializer (FR-2.5, FR-2.7, FR-2.8-2.10).
        - id rendered as ObjectId-safe string
        - user assigned server-side only (owner-only, RBAC)
        - cup_size: female-only rule (FR-2.7), but null/blank ACCEPTED and normalized
        - height/weight ranges enforced per checklist confirmation (120-230cm, 30-200)
        - ADDED: style_focus (4 options) + body_build_cm (86-112 cm slider)
      properties:
        id:
          type: string
          readOnly: true
        user:
          type: string
          readOnly: true
        cup_size:
          type: string
          nullable: true
          maxLength: 5
        name:
          type: string
          maxLength: 100
        gender:
          $ref: '#/components/schemas/GenderEnum'
        height:
          type: number
          format: double
          description: Height in cm (decimal preserved)
        weight:
          type: number
          format: double
          description: Weight in kg (decimal preserved)
        skin_tone:
          type: string
          maxLength: 32
        undertone:
          $ref: '#/components/schemas/UndertoneEnum'
        shoulder:
          $ref: '#/components/schemas/ShoulderEnum'
        waist:
          $ref: '#/components/schemas/WaistEnum'
        hip:
          $ref: '#/components/schemas/HipEnum'
        thigh:
          $ref: '#/components/schemas/ThighEnum'
        style_focus:
          $ref: '#/components/schemas/StyleFocusEnum'
        body_build_cm:
          type: number
          format: double
          description: Body build (chest girth) in cm, 86-112 (decimal preserved)
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - gender
      - height
      - id
      - name
      - updated_at
      - user
      - weight
    CSVUpload:
      type: object
      properties:
        csv_file:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
          writeOnly: true
          maxItems: 20
      required:
      - csv_file
      - images
    Cart:
      type: object
      description: Cart contents with a total based on current catalog prices.
      properties:
        id:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total_amount:
          type: string
          readOnly: true
        item_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - item_count
      - items
      - total_amount
      - updated_at
    CartItem:
      type: object
      description: |-
        Current catalog details for a cart entry.

        KAN-FIX: the Side view was permanently removed, so CatalogItem has NO
        side_image field. The old side_image_url attribute read raised
        AttributeError on every cart render ("The cart was updated but could not
        be rendered"). Side image is fully removed; remaining images are read via
        getattr so a missing column degrades to null instead of crashing.
      properties:
        id:
          type: string
          readOnly: true
        catalog_item:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        store_name:
          type: string
          readOnly: true
        price:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        available:
          type: string
          readOnly: true
        unavailable_reason:
          type: string
          readOnly: true
        seller_account_deleted:
          type: boolean
          readOnly: true
        front_image_url:
          type: string
          readOnly: true
        rear_image_url:
          type: string
          readOnly: true
      required:
      - available
      - catalog_item
      - front_image_url
      - id
      - name
      - price
      - quantity
      - rear_image_url
      - seller_account_deleted
      - store_name
      - unavailable_reason
    CatalogItem:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        seller:
          type: string
          readOnly: true
        batch:
          type: string
