openapi: 3.0.3
info:
  title: FitFusion AI API
  version: 1.0.0
  description: Seller catalog upload and management API
paths:
  /api/recommendations/:
    get:
      operationId: api_recommendations_retrieve
      description: |-
        GET /api/recommendations/ - ranked, explainable recommendations.

        Query params: undertone (warm|cool|neutral), height_cm, body_shape
        (top-heavy|bottom-heavy|balanced), styles (csv), occasions (csv), limit.

        Response includes, per item: total_score, max_score, the four baselined
        FR-7.2 rules (fired or not, with reasons) AND the catalog metadata the
        Fitting Studio renders (id, store, category, size, cm reference, color,
        price, front image).
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/recommendations/{item_id}/match-reasons/:
    get:
      operationId: api_recommendations_match_reasons_retrieve
      description: |-
        GET /api/recommendations/<item_id>/match-reasons/ - explain one item.

        Returns the four-rule breakdown plus 'weights' so the UI can show
        score/maxScore per rule, plus the item metadata for the selected-item
        header.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: 'FR-1.3: change password with current-password verification.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
