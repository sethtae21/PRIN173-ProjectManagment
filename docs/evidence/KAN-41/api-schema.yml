      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: auth_user_profile_destroy
      description: |-
        FR-1.2 / FR-1.3: Get and update the authenticated user's profile.

